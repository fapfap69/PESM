<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PESM Test Bench</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../public/css/testbench.css">
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">
                    <span class="badge bg-primary">PESM</span> 
                    Test Bench - Interactive Script Playground
                </h1>
            </div>
        </div>
        
        <div class="row">
            <!-- Script Editor -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">📝 Script Editor</h5>
                    </div>
                    <div class="card-body">
                        <form id="scriptForm" method="POST">
                            <div class="mb-3">
                                <label for="script" class="form-label">Script Code</label>
                                <textarea id="script" name="script" class="form-control font-monospace" rows="15" placeholder="Enter your script here...">name = "World"
MESSAGE "Hello " + name</textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="variables" class="form-label">Initial Variables (JSON)</label>
                                <textarea id="variables" name="variables" class="form-control font-monospace" rows="4" placeholder='{"var1": "value1", "var2": 123}'>{}</textarea>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100">
                                ▶️ Execute Script
                            </button>
                        </form>
                    </div>
                </div>
                
                <!-- Examples -->
                <div class="card mt-3">
                    <div class="card-header">
                        <h6 class="mb-0">📚 Quick Examples</h6>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-sm btn-outline-primary me-2 mb-2" onclick="loadExample('hello')">Hello World</button>
                        <button class="btn btn-sm btn-outline-primary me-2 mb-2" onclick="loadExample('if')">IF Statement</button>
                        <button class="btn btn-sm btn-outline-primary me-2 mb-2" onclick="loadExample('foreach')">FOREACH Loop</button>
                        <button class="btn btn-sm btn-outline-primary me-2 mb-2" onclick="loadExample('array')">Arrays</button>
                    </div>
                </div>
            </div>
            
            <!-- Results Panel -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">📊 Execution Results</h5>
                    </div>
                    <div class="card-body">
                        <div id="results">
                            <div class="alert alert-secondary">
                                <strong>Ready!</strong> Enter a script and click Execute.
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Variables Output -->
                <div class="card mt-3">
                    <div class="card-header">
                        <h6 class="mb-0">🔢 Variables State</h6>
                    </div>
                    <div class="card-body">
                        <pre id="variablesOutput" class="mb-0"><code>{}</code></pre>
                    </div>
                </div>
                
                <!-- Execution Log -->
                <div class="card mt-3">
                    <div class="card-header">
                        <h6 class="mb-0">📋 Execution Log</h6>
                    </div>
                    <div class="card-body">
                        <pre id="executionLog" class="mb-0" style="max-height: 200px; overflow-y: auto;"><code>Waiting for execution...</code></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../public/js/testbench.js"></script>
</body>
</html>
